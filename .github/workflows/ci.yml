name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Blue retrieval evaluation
        run: BLUE_RAG_EVAL_FORCE_LOCAL=1 npm run eval:blue-rag

      - name: AI behaviour evaluation
        run: npm run eval:ai-behavior

      - name: Install Blue server dependencies
        run: npm install --legacy-peer-deps
        working-directory: blue-server

      - name: Type check Blue server
        run: npx tsc --noEmit
        working-directory: blue-server

      - name: Install CRE workflows dependencies
        run: npm install --legacy-peer-deps
        working-directory: cre-workflows

      - name: Type check CRE workflows
        run: npx tsc -p cre-workflows/tsconfig.json --noEmit
